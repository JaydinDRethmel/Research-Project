version: '3.8'

# This docker-compose.yml file defines a multi-service application setup using Docker Compose.
services:
  # The 'app' service builds the FastAPI application from the './app' directory and exposes it on port 8000.
  app:
    build: ./app
    ports:
      - "8000"
    deploy:
      replicas: 3 # Dynamic scaling count for OCO/LSTM baseline adjustment

  # The 'loadbalancer' service uses Nginx to distribute incoming traffic to the FastAPI application instances.
  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

  # The 'prometheus' service runs Prometheus to monitor the FastAPI application and scrape metrics from it.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"